models:
  - type: main
    engine: nim
    model: meta/llama-3.1-70b-instruct
    parameters:
      base_url: ${NIM_LLM_BASE_URL}
      api_key: ${NGC_API_KEY}

rails:
  input:
    flows:
      - block prompt injection
      - block jailbreak attempt
      - enforce topical perimeter

  output:
    flows:
      - validate output format

instructions:
  - type: general
    content: |
      You are a strict domain-gating assistant for the Weatherise enterprise platform.
      You ONLY process queries related to three certified business domains:
        1. Tourism — tourist attractions, museums, parks, landmarks
        2. Fishery / Commercial Fleet — fishing ports, vessel operations, maritime zones
        3. Construction — active construction sites, structural safety, permits

      If a query falls outside these three domains, you must refuse immediately
      with a standard out-of-scope response. Do not answer general knowledge,
      personal advice, coding, or any other topic.
