services:
  # ── Reverse Proxy ──────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: weatherise-nginx
    ports:
      - "8080:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
      - api
      - mcp-server
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ── Frontend Website ────────────────────────────────────────
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: weatherise-web
    environment:
      - NEXT_PUBLIC_API_BASE_URL=/api
      - NEXT_PUBLIC_WS_URL=/ws
    restart: unless-stopped

  # ── FastAPI Backend ─────────────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: weatherise-api
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - POSTGRES_URL=postgresql://weatherise:weatherise@postgres:5432/weatherise
      - QDRANT_URL=http://vector-db:6333
      - MCP_SERVER_URL=http://mcp-server:9000
      - NIM_LLM_BASE_URL=http://host.docker.internal:8001/v1
      - NIM_EMBED_BASE_URL=http://host.docker.internal:8002/v1
      - NIM_LLM_MODEL=nvidia/llama-3.1-nemotron-nano-8b-v1
      - NIM_EMBED_MODEL=nvidia/nv-embedqa-e5-v5
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      vector-db:
        condition: service_healthy
      mcp-server:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MCP Server ──────────────────────────────────────────────
  mcp-server:
    build:
      context: ./mcp
      dockerfile: Dockerfile
    container_name: weatherise-mcp
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - OPENWEATHERMAP_API_KEY=${OPENWEATHERMAP_API_KEY}
      - OPEN_METEO_BASE_URL=https://api.open-meteo.com/v1
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Vector Database (Qdrant) ────────────────────────────────
  vector-db:
    image: qdrant/qdrant:latest
    container_name: weatherise-qdrant
    volumes:
      - /raid/team/weatherise/vector_db:/qdrant/storage
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ───────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: weatherise-redis
    command: redis-server --appendonly yes
    volumes:
      - /raid/team/weatherise/redis_v2:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16
    container_name: weatherise-postgres
    environment:
      - POSTGRES_DB=weatherise
      - POSTGRES_USER=weatherise
      - POSTGRES_PASSWORD=weatherise
    volumes:
      - /raid/team/weatherise/postgres_v2:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U weatherise"]
      interval: 5s
      timeout: 3s
      retries: 5

# NOTE: NVIDIA NIM containers (nim-llm on :8001, nim-embed on :8002)
# are already running separately with GPU allocation.
# They are accessed via host.docker.internal from containers.
